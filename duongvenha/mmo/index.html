<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TP HI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase Compatibility Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 600: '#2563eb', 700: '#1d4ed8' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

<!-- Header -->
<header class="bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-primary-600 dark:text-blue-400 flex items-center gap-2">
      <i class="fa-solid fa-building-columns"></i> Bank Manager
    </h1>
    
    <div class="flex items-center gap-3">
      <!-- Dark mode toggle -->
      <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <i class="fa-solid fa-moon text-xl"></i>
      </button>

      <!-- Auth Section -->
      <div id="authContainer" class="flex items-center gap-2">
        <!-- Khi chưa đăng nhập -->
        <div id="loggedOutState" class="flex items-center gap-2">
          <button id="loginGoogleBtn" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition">
            <i class="fa-brands fa-google text-red-500"></i> <span class="hidden sm:inline">Google</span>
          </button>
          <button id="loginTwitterBtn" class="bg-black hover:bg-gray-800 text-white px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition">
            <i class="fa-brands fa-x-twitter"></i> <span class="hidden sm:inline">Twitter / X</span>
          </button>
        </div>

        <!-- Khi đã đăng nhập -->
        <div id="loggedInState" class="hidden items-center gap-3">
          <button id="addBankBtn" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-md transition text-sm">
            <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Thêm ngân hàng</span>
          </button>
          
          <div class="flex items-center gap-2 border-l border-gray-200 dark:border-gray-700 pl-3">
            <img id="userAvatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-300 dark:border-gray-600 object-cover" />
            <span id="userName" class="text-sm font-medium hidden md:inline"></span>
            <button id="logoutBtn" title="Đăng xuất" class="p-2 text-gray-500 hover:text-red-600 dark:hover:text-red-400 transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Filter & Controls -->
  <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white dark:bg-gray-900 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800">
    <div class="w-full sm:w-64">
      <label for="countryFilter" class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Lọc theo quốc gia</label>
      <select id="countryFilter" class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 w-full outline-none">
        <option value="">Tất cả quốc gia</option>
      </select>
    </div>
    <div class="text-sm text-gray-600 dark:text-gray-400 font-medium">
      Tổng số: <span id="bankCount" class="font-bold text-primary-600 dark:text-blue-400">0</span> ngân hàng
    </div>
  </div>

  <!-- Bank Grid -->
  <div id="bankGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <!-- Dynamic Cards -->
  </div>

  <!-- Empty state -->
  <div id="emptyState" class="hidden text-center py-20">
    <i class="fa-solid fa-building-columns text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
    <h3 class="text-xl font-medium mb-2">Chưa có dữ liệu ngân hàng</h3>
    <p class="text-gray-500 dark:text-gray-400 max-w-md mx-auto">Vui lòng đăng nhập và nhấn nút "Thêm ngân hàng" để bổ sung thông tin.</p>
  </div>
</main>

<!-- Modal Add/Edit -->
<div id="bankModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-200 dark:border-gray-700 transform transition-all">
    <div class="p-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
      <h2 class="text-lg font-bold" id="modalTitle">Thêm ngân hàng mới</h2>
      <button id="closeModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold p-1">&times;</button>
    </div>
    
    <form id="bankForm" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
      <div>
        <label class="block text-sm font-medium mb-1">Quốc gia (ISO2) <span class="text-red-500">*</span></label>
        <select id="countryCode" required class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 text-sm outline-none">
          <option value="">Chọn quốc gia...</option>
          <option value="VN">Việt Nam (VN)</option>
          <option value="US">Hoa Kỳ (US)</option>
          <option value="TH">Thái Lan (TH)</option>
          <option value="SG">Singapore (SG)</option>
          <option value="MY">Malaysia (MY)</option>
          <option value="ID">Indonesia (ID)</option>
          <option value="JP">Nhật Bản (JP)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Mã ngân hàng <span class="text-red-500">*</span></label>
          <input type="text" id="bankCode" required placeholder="VCB, TCB..." class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 text-sm outline-none uppercase" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Tên ngắn</label>
          <input type="text" id="shortName" placeholder="Vietcombank" class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 text-sm outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Tên đầy đủ <span class="text-red-500">*</span></label>
        <input type="text" id="bankName" required placeholder="Ngân hàng TMCP Ngoại thương Việt Nam" class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 text-sm outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">BIN / Prefix</label>
        <input type="text" id="binPrefix" placeholder="970436" class="w-full px-3.5 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 text-sm outline-none" />
      </div>

      <!-- Icon / Logo Section -->
      <div class="space-y-2 pt-1 border-t border-gray-200 dark:border-gray-700">
        <label class="block text-sm font-medium">Logo / Icon ngân hàng</label>
        
        <div class="flex items-center gap-3">
          <div id="iconPreview" class="w-12 h-12 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 flex items-center justify-center text-gray-400 overflow-hidden flex-shrink-0">
            <i class="fa-solid fa-image text-xl"></i>
          </div>

          <div class="flex-1 space-y-2">
            <input type="text" id="logoUrl" placeholder="URL hình ảnh (https://...)" class="w-full px-3 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs outline-none" />
            <div class="flex items-center gap-2">
              <span class="text-xs text-gray-400">hoặc</span>
              <label class="cursor-pointer bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 text-xs px-3 py-1 rounded transition font-medium">
                Tải ảnh từ máy
                <input type="file" id="iconFile" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button" id="cancelModal" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition">Hủy</button>
        <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-5 py-2 rounded-lg font-medium text-sm shadow transition">Lưu dữ liệu</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-xl transform translate-y-24 transition-all duration-300 opacity-0 z-50 font-medium text-sm flex items-center gap-2">
</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC3eiZy3Jxltpx-QXKFx-WNUlKdNLhBH2I",
    authDomain: "bigdata-c9bd2.firebaseapp.com",
    databaseURL: "https://bigdata-c9bd2-default-rtdb.firebaseio.com",
    projectId: "bigdata-c9bd2",
    storageBucket: "bigdata-c9bd2.firebasestorage.app",
    messagingSenderId: "168926822259",
    appId: "1:168926822259:web:58080669cc0af722958f06"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // Elements
  const bankGrid = document.getElementById('bankGrid');
  const emptyState = document.getElementById('emptyState');
  const bankCountEl = document.getElementById('bankCount');
  const countryFilter = document.getElementById('countryFilter');
  const addBtn = document.getElementById('addBankBtn');
  const modal = document.getElementById('bankModal');
  const closeModal = document.getElementById('closeModal');
  const cancelModal = document.getElementById('cancelModal');
  const form = document.getElementById('bankForm');
  const modalTitle = document.getElementById('modalTitle');
  const toast = document.getElementById('toast');
  
  const loggedInState = document.getElementById('loggedInState');
  const loggedOutState = document.getElementById('loggedOutState');
  const loginGoogleBtn = document.getElementById('loginGoogleBtn');
  const loginTwitterBtn = document.getElementById('loginTwitterBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userAvatar = document.getElementById('userAvatar');
  const userName = document.getElementById('userName');

  const logoUrlInput = document.getElementById('logoUrl');
  const iconFileInput = document.getElementById('iconFile');
  const iconPreview = document.getElementById('iconPreview');

  let allBanks = [];
  let currentEditKey = null;
  let currentUser = null;

  // Dark theme
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  });

  if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }

  // --- Auth Handlers ---
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) {
      loggedInState.classList.remove('hidden');
      loggedInState.classList.add('flex');
      loggedOutState.classList.add('hidden');
      userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
      userName.textContent = user.displayName || 'User';
    } else {
      loggedInState.classList.add('hidden');
      loggedInState.classList.remove('flex');
      loggedOutState.classList.remove('hidden');
    }
  });

  loginGoogleBtn.addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => showToast(err.message, 'error'));
  });

  loginTwitterBtn.addEventListener('click', () => {
    const provider = new firebase.auth.TwitterAuthProvider();
    auth.signInWithPopup(provider).catch(err => showToast(err.message, 'error'));
  });

  logoutBtn.addEventListener('click', () => {
    auth.signOut().then(() => showToast('Đã đăng xuất', 'success'));
  });

  // --- Realtime Data Sync ---
  const banksRef = db.ref('countries');
  banksRef.on('value', (snapshot) => {
    allBanks = [];
    const countries = snapshot.val() || {};

    Object.entries(countries).forEach(([countryCode, data]) => {
      if (data && data.banks) {
        Object.entries(data.banks).forEach(([bankCode, bank]) => {
          allBanks.push({
            country: countryCode,
            code: bankCode,
            ...bank
          });
        });
      }
    });

    renderBanks(allBanks);
    updateCountryFilter(allBanks);
  });

  function renderBanks(banks) {
    bankGrid.innerHTML = '';
    bankCountEl.textContent = banks.length;

    if (banks.length === 0) {
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');

    banks.forEach(bank => {
      const card = document.createElement('div');
      card.className = 'bg-white dark:bg-gray-900 rounded-xl shadow-sm hover:shadow-md transition duration-200 border border-gray-200 dark:border-gray-800 flex flex-col justify-between overflow-hidden';
      card.innerHTML = `
        <div class="p-5">
          <div class="flex items-start gap-3 mb-3">
            ${bank.logo ? 
              `<img src="${bank.logo}" alt="${bank.shortName || bank.name}" class="w-12 h-12 object-contain rounded-lg bg-gray-50 dark:bg-gray-800 p-1 border border-gray-100 dark:border-gray-700 flex-shrink-0">` : 
              `<div class="w-12 h-12 rounded-lg bg-primary-100 dark:bg-blue-900/30 flex items-center justify-center text-primary-600 dark:text-blue-400 font-bold text-lg flex-shrink-0">${bank.code.slice(0,3)}</div>`}
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-base truncate" title="${bank.name}">${bank.name}</h3>
              <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">${bank.shortName || bank.code}</p>
            </div>
          </div>
          <div class="space-y-1.5 text-xs text-gray-600 dark:text-gray-300">
            <p><span class="font-semibold text-gray-400">Quốc gia:</span> ${bank.country}</p>
            <p><span class="font-semibold text-gray-400">Mã Bank:</span> ${bank.code}</p>
            ${bank.bin ? `<p><span class="font-semibold text-gray-400">BIN:</span> ${bank.bin}</p>` : ''}
          </div>
        </div>

        <div class="px-5 py-3 bg-gray-50/50 dark:bg-gray-800/40 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center text-xs">
          <div class="flex items-center gap-1.5 text-gray-400" title="Cập nhật bởi ${bank.updatedBy || 'Hệ thống'}">
            ${bank.userAvatar ? `<img src="${bank.userAvatar}" class="w-4 h-4 rounded-full">` : '<i class="fa-solid fa-user-gear"></i>'}
            <span class="truncate max-w-[100px]">${bank.updatedBy || 'System'}</span>
          </div>
          ${currentUser ? `
            <button onclick="editBank('${bank.country}','${bank.code}')" class="text-primary-600 hover:text-primary-700 dark:text-blue-400 dark:hover:text-blue-300 font-medium flex items-center gap-1">
              <i class="fa-solid fa-pen-to-square"></i> Sửa
            </button>
          ` : ''}
        </div>
      `;
      bankGrid.appendChild(card);
    });
  }

  function updateCountryFilter(banks) {
    const current = countryFilter.value;
    const countries = [...new Set(banks.map(b => b.country))].sort();
    
    countryFilter.innerHTML = '<option value="">Tất cả quốc gia</option>';
    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countryFilter.appendChild(opt);
    });
    if (countries.includes(current)) countryFilter.value = current;
  }

  countryFilter.addEventListener('change', () => {
    const filter = countryFilter.value;
    const filtered = filter ? allBanks.filter(b => b.country === filter) : allBanks;
    renderBanks(filtered);
  });

  // --- Image Preview Handlers ---
  logoUrlInput.addEventListener('input', (e) => {
    const url = e.target.value.trim();
    if (url) {
      iconPreview.innerHTML = `<img src="${url}" class="w-full h-full object-contain" onerror="this.src=''; this.onerror=null; this.parentElement.innerHTML='<i class=\\'fa-solid fa-triangle-exclamation text-amber-500\\'></i>'"/>`;
    } else {
      iconPreview.innerHTML = `<i class="fa-solid fa-image text-xl"></i>`;
    }
  });

  iconFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const base64Img = evt.target.result;
        logoUrlInput.value = base64Img;
        iconPreview.innerHTML = `<img src="${base64Img}" class="w-full h-full object-contain" />`;
      };
      reader.readAsDataURL(file);
    }
  });

  // --- Modal Logic ---
  function openModal(isEdit = false, title = 'Thêm ngân hàng mới') {
    modalTitle.textContent = title;
    modal.classList.remove('hidden');
    document.getElementById('countryCode').disabled = isEdit;
    document.getElementById('bankCode').disabled = isEdit;
    if (!isEdit) {
      form.reset();
      currentEditKey = null;
      iconPreview.innerHTML = `<i class="fa-solid fa-image text-xl"></i>`;
    }
  }

  function closeModalHandler() {
    modal.classList.add('hidden');
    form.reset();
    currentEditKey = null;
    iconPreview.innerHTML = `<i class="fa-solid fa-image text-xl"></i>`;
  }

  addBtn.addEventListener('click', () => {
    if (!currentUser) {
      showToast('Vui lòng đăng nhập để thực hiện', 'error');
      return;
    }
    openModal();
  });

  closeModal.addEventListener('click', closeModalHandler);
  cancelModal.addEventListener('click', closeModalHandler);
  modal.addEventListener('click', e => { if (e.target === modal) closeModalHandler(); });

  // Save/Update Form Data
  form.addEventListener('submit', e => {
    e.preventDefault();

    if (!currentUser) {
      showToast('Bạn phải đăng nhập để lưu dữ liệu', 'error');
      return;
    }

    const country = document.getElementById('countryCode').value.trim().toUpperCase();
    const code = document.getElementById('bankCode').value.trim().toUpperCase();
    const name = document.getElementById('bankName').value.trim();

    if (!country || !code || !name) {
      showToast('Vui lòng điền đầy đủ các thông tin bắt buộc', 'error');
      return;
    }

    const data = {
      code,
      name,
      shortName: document.getElementById('shortName').value.trim(),
      bin: document.getElementById('binPrefix').value.trim(),
      logo: logoUrlInput.value.trim(),
      status: 'active',
      updatedAt: new Date().toISOString(),
      updatedBy: currentUser.displayName || currentUser.email,
      userAvatar: currentUser.photoURL || ''
    };

    if (!currentEditKey) data.createdAt = new Date().toISOString();

    const ref = db.ref(`countries/${country}/banks/${code}`);

    ref.set(data)
      .then(() => {
        showToast(currentEditKey ? 'Cập nhật thành công!' : 'Thêm ngân hàng thành công!', 'success');
        closeModalHandler();
      })
      .catch(err => {
        showToast('Lỗi: ' + err.message, 'error');
      });
  });

  window.editBank = function(country, code) {
    if (!currentUser) {
      showToast('Vui lòng đăng nhập để chỉnh sửa', 'error');
      return;
    }

    const bank = allBanks.find(b => b.country === country && b.code === code);
    if (!bank) return;

    document.getElementById('countryCode').value = bank.country;
    document.getElementById('bankCode').value = bank.code;
    document.getElementById('bankName').value = bank.name;
    document.getElementById('shortName').value = bank.shortName || '';
    document.getElementById('binPrefix').value = bank.bin || '';
    logoUrlInput.value = bank.logo || '';

    if (bank.logo) {
      iconPreview.innerHTML = `<img src="${bank.logo}" class="w-full h-full object-contain"/>`;
    } else {
      iconPreview.innerHTML = `<i class="fa-solid fa-image text-xl"></i>`;
    }

    currentEditKey = `${country}/${code}`;
    openModal(true, `Chỉnh sửa ${bank.code} (${bank.country})`);
  };

  function showToast(message, type = 'success') {
    toast.innerHTML = type === 'success' 
      ? `<i class="fa-solid fa-circle-check"></i> ${message}`
      : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
    
    toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-xl transform translate-y-0 opacity-100 transition-all duration-300 z-50 font-medium text-sm flex items-center gap-2 ${
      type === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
    }`;
    
    setTimeout(() => {
      toast.classList.add('translate-y-24', 'opacity-0');
    }, 3000);
  }
</script>
</body>
</html>
